seed: 12580

data:
  dataset_root: /data/limengfei/xingqunqi/Exo2Ego-dataset
  manifest: /data/limengfei/xingqunqi/Exo2Ego-dataset/exo2ego_manifest.json
  image_size: 384
  exo_calibration_size: [3840, 2160]
  ego_calibration_size: [512, 512]
  # Cache target arrays only (not NPZ heatmaps); 800 covers all takes per worker.
  label_cache_size: 800
  augmentation:
    color_jitter_probability: 0.8
    brightness: 0.2
    contrast: 0.2
    saturation: 0.15
    blur_probability: 0.1
    noise_probability: 0.15
    noise_std: 0.02
    erase_probability: 0.1
    erase_max_area: 0.08

model:
  image_size: 384
  pretrained: true
  weights: IMAGENET1K_SWAG_E2E_V1
  hidden_dim: 512
  dropout: 0.1
  use_camera: true
  camera_dim: 20
  camera_hidden_dim: 128

loss:
  confidence_tau: 0.2
  confidence_gamma: 1.0
  smooth_l1_beta: 0.01
  lambda_camera: 1.0
  lambda_residual: 0.0001

train:
  stage: rgb
  epochs: 50
  freeze_backbone_epochs: 4
  batch_size: 8
  val_batch_size: 16
  num_workers: 8
  accumulation_steps: 1
  backbone_lr: 0.00001
  rgb_head_lr: 0.0001
  camera_lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 5
  early_stopping_patience: 6
  early_stopping_min_delta: 0.0001
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  output_dir: outputs/rgb
